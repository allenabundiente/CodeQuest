<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#070a0f" />
    <title>CodeQuest — offline</title>
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background:
          radial-gradient(900px 420px at 15% -10%, rgba(124, 242, 156, 0.1), transparent 65%),
          #070a0f;
        color: #e9eff7;
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
        text-align: center;
      }
      main {
        max-width: 440px;
        padding: 32px;
        border: 1px solid #202d3c;
        border-radius: 20px;
        background: #101722;
      }
      svg {
        width: 84px;
        height: 84px;
        margin-bottom: 8px;
      }
      h1 {
        margin: 8px 0 10px;
        font-size: 23px;
        letter-spacing: -0.02em;
      }
      p {
        margin: 0 0 18px;
        color: #8ea1b6;
        line-height: 1.6;
        font-size: 14px;
      }
      a {
        display: inline-block;
        padding: 11px 18px;
        border-radius: 10px;
        background: #7cf29c;
        color: #062c17;
        font-weight: 700;
        text-decoration: none;
      }
      .muted {
        margin-top: 16px;
        font-size: 12px;
        color: #64758a;
      }
    </style>
  </head>
  <body>
    <main>
      <svg viewBox="0 0 96 96" aria-hidden="true">
        <rect x="8" y="20" width="80" height="60" rx="20" fill="#0b1119" stroke="#7cf29c" stroke-width="3" />
        <circle cx="36" cy="46" r="5" fill="#7cf29c" />
        <circle cx="60" cy="46" r="5" fill="#7cf29c" />
        <path d="M36 60c7 6 17 6 24 0" stroke="#7cf29c" stroke-width="3" stroke-linecap="round" fill="none" />
        <path d="M48 20V10" stroke="#7cf29c" stroke-width="3" stroke-linecap="round" />
        <circle cx="48" cy="8" r="4" fill="#7fb2ff" />
      </svg>
      <h1>You are offline</h1>
      <p>
        CodeQuest needs a connection to generate lessons and run sandbox tests.
        Your saved progress stays on the server — reconnect and pick up where you
        left off.
      </p>
      <a href="/">Try again</a>
      <p class="muted">This page is cached by the CodeQuest service worker.</p>
    </main>
  </body>
</html>

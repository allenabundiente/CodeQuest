name: Mirror to backup

on:
  push:
    branches: [main]
    tags: ["**"]

permissions:
  contents: read

concurrency:
  group: mirror-${{ github.ref }}
  cancel-in-progress: false

jobs:
  mirror:
    name: Push to Des-troy09/CodeQuest
    runs-on: ubuntu-latest
    env:
      BACKUP_REPO: git@github.com:Des-troy09/CodeQuest.git
      BACKUP_DEPLOY_KEY: ${{ secrets.BACKUP_DEPLOY_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Warn when the deploy key is missing
        if: env.BACKUP_DEPLOY_KEY == ''
        run: echo "::warning::BACKUP_DEPLOY_KEY is not configured; backup mirror skipped."

      - name: Configure SSH
        if: env.BACKUP_DEPLOY_KEY != ''
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$BACKUP_DEPLOY_KEY" > ~/.ssh/backup_key
          chmod 600 ~/.ssh/backup_key
          ssh-keyscan -H github.com >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          git remote add backup "$BACKUP_REPO"
          git config --local core.sshCommand "ssh -i $HOME/.ssh/backup_key -o IdentitiesOnly=yes"

      - name: Mirror main
        if: github.ref == 'refs/heads/main' && env.BACKUP_DEPLOY_KEY != ''
        run: git push backup HEAD:main

      - name: Mirror tags
        if: startsWith(github.ref, 'refs/tags/') && env.BACKUP_DEPLOY_KEY != ''
        run: git push backup --tags

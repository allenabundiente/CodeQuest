services:
  - type: web
    name: codequest
    runtime: docker
    plan: free
    region: singapore
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      # Free tier has no persistent disk. SQLite is a local cache restored from
      # and snapshotted to Supabase Storage; see README "Data on the free tier".
      - key: DATABASE_PATH
        value: /tmp/codequest.db
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_STORAGE_BUCKET
        value: codequest
      - key: SUPABASE_SNAPSHOT_PATH
        value: codequest.db
      - key: NEXT_PUBLIC_APP_VERSION
        sync: false
      - key: MIN_SUPPORTED_VERSION
        value: 0.1.0
      - key: NEXT_PUBLIC_ENABLE_SW
        value: "true"
      - key: FEATURE_FLAGS
        value: "{}"
      - key: DEVELOPER_EMAILS
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GITHUB_TOKEN
        sync: false
      - key: SANDBOX_DRIVER
        value: piston
      - key: PISTON_URL
        sync: false
      - key: JUDGE0_URL
        sync: false
      - key: JUDGE0_AUTH_TOKEN
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM
        value: CodeQuest <streaks@example.com>
      - key: APP_URL
        sync: false
      - key: CRON_SECRET
        generateValue: true
      - key: SENTRY_DSN
        sync: false
      - key: NEXT_PUBLIC_SENTRY_DSN
        sync: false

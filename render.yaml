services:
  - type: web
    name: codequest
    runtime: node
    plan: starter
    region: singapore
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm run start
    healthCheckPath: /api/ready
    autoDeploy: false
    disk:
      name: codequest-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: 22.13.0
      - key: NODE_ENV
        value: production
      - key: DATABASE_PATH
        value: /var/data/codequest.db
      - key: NEXT_PUBLIC_APP_VERSION
        sync: false
      - key: MIN_SUPPORTED_VERSION
        value: 0.1.0
      - key: NEXT_PUBLIC_ENABLE_SW
        value: "true"
      - key: DEVELOPER_EMAILS
        sync: false
      - key: FEATURE_FLAGS
        value: "{}"
      - key: OPENROUTER_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GITHUB_TOKEN
        sync: false
      - key: SANDBOX_DRIVER
        value: piston
      - key: PISTON_URL
        sync: false
      - key: JUDGE0_URL
        sync: false
      - key: JUDGE0_AUTH_TOKEN
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM
        value: CodeQuest <streaks@example.com>
      - key: APP_URL
        sync: false
      - key: CRON_SECRET
        generateValue: true
      - key: SENTRY_DSN
        sync: false
      - key: NEXT_PUBLIC_SENTRY_DSN
        sync: false
